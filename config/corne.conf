# Uncomment the following lines to enable the Corne RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y

CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=100
# Case color #30D5D8 — H:181° S:78% B:85%, solid, always on
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=181
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=78
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=85
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y


# Standard Corne OLED (128x32) — built-in status dashboard, always on
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

#Config power
CONFIG_ZMK_EXT_POWER=y

#Stronger Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 3 host profiles (+1 connection slot for split right half)
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

#Mouse support
CONFIG_ZMK_MOUSE=y


# Desk / USB: always listening, no deep sleep, peripherals stay on
CONFIG_ZMK_SLEEP=n
